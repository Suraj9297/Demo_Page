<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Invisible Anti-Phishing Protection -->
    <meta name="robots" content="noindex,nofollow">
    <meta http-equiv="Content-Security-Policy" content="form-action 'none'; base-uri 'self';">

    <title>DocFlow Pro | Register Account</title>

    <style>
        /* ====== YOUR ORIGINAL CSS — UNTOUCHED ====== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0a0f1a;
            background-image: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)),
                url('https://images.unsplash.com/photo-1507842217343-583bb7270b66?auto=format&fit=crop&q=80&w=2000');
            background-size: cover;
            background-position: center;
            overflow: hidden;
            color: white;
        }

        .gold-plaque {
            background: linear-gradient(145deg, #d4af37, #b8860b);
            border: 2px solid #7d5a1a;
            padding: 12px 20px;
            margin-bottom: 25px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
            border-radius: 4px;
            display: inline-block;
        }

        .gold-plaque h1 {
            color: #1a1408;
            font-size: 1.3rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            font-weight: 900;
        }

        .signup-card {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 450px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: 24px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .input-group {
            margin-bottom: 15px;
            position: relative;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 10px;
            color: #fff;
            font-size: 0.85rem;
            outline: none;
            transition: all 0.3s ease;
            text-align: center;
        }

        input:focus,
        select:focus {
            border-color: #00d4ff;
            box-shadow: 0 0 12px rgba(0, 212, 255, 0.3);
        }

        .btn-register {
            width: 100%;
            padding: 14px;
            background: #00d4ff;
            border: none;
            border-radius: 10px;
            color: #001a1a;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: 0.4s;
            margin-top: 10px;
        }

        .btn-register:hover {
            background: #fff;
            transform: scale(1.02);
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.6);
        }

        .footer-text {
            margin-top: 20px;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.6);
        }

        .login-link {
            color: #00d4ff;
            text-decoration: none;
            font-weight: 700;
            text-transform: uppercase;
            margin-left: 8px;
            transition: 0.3s;
        }

        .login-link:hover {
            color: #fff;
            text-shadow: 0 0 10px #00d4ff;
        }

        .error-msg {
            color: #ff4d4d;
            font-size: 0.75rem;
            margin-top: 5px;
            display: none;
        }

    </style>
</head>

<body>

    <div class="signup-card">

        <div class="gold-plaque">
            <h1>Create Account</h1>
        </div>

        <form id="signupForm" autocomplete="off">

            <div class="input-group">
                <select required>
                    <option value="" disabled selected>SELECT YOUR ROLE</option>
                    <option value="admin">ADMINISTRATOR</option>
                    <option value="teacher">TEACHER</option>
                    <option value="student">STUDENT</option>
                </select>
            </div>

            <div class="input-group">
                <input type="text" placeholder="FULL NAME" required>
            </div>

            <div class="input-group">
                <input type="text" placeholder="CHOOSE USERNAME" required>
            </div>

            <!-- ORIGINAL PASSWORD FIELD KEPT -->
            <div class="input-group">
                <input type="password" id="password" placeholder="PASSWORD" required autocomplete="new-password">
            </div>

            <div class="input-group">
                <input type="password" id="confirmPassword" placeholder="CONFIRM PASSWORD" required autocomplete="new-password">
                <div id="errorMessage" class="error-msg">Passwords do not match!</div>
            </div>

            <button type="submit" class="btn-register">
                Register System User
            </button>

        </form>

        <div class="footer-text">
            Already have an account?
            <a href="index.html" class="login-link">Login</a>
        </div>

    </div>

    <script>
        document.getElementById('signupForm').addEventListener('submit', function (e) {
            e.preventDefault();

            const pass = document.getElementById('password').value;
            const confirmPass = document.getElementById('confirmPassword').value;
            const errorDiv = document.getElementById('errorMessage');

            if (pass !== confirmPass) {
                errorDiv.style.display = 'block';
            } else {
                errorDiv.style.display = 'none';
                alert("Demo Account Created Successfully!");
                window.location.href = "index.html";
            }
        });
    </script>

</body>

</html>
